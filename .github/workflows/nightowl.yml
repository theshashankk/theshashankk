name: Update Coding Clock

on:
  schedule:
    - cron: "0 3 * * *"    # once a day, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-owl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run night owl stats script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python nightowl.py

      - name: Commit changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coding clock stats"
          file_pattern: README.md
