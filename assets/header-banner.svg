<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="50%" stop-color="#130f26"/>
      <stop offset="100%" stop-color="#0b0f1c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <style>
      .code { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; font-size: 17px; }
      .kw   { fill: #f472b6; }
      .str  { fill: #a5d6a7; }
      .prop { fill: #7dd3fc; }
      .pun  { fill: #8b8ba7; }
      .com  { fill: #6b7280; font-style: italic; }
      .ln   { font-family: Consolas, monospace; font-size: 14px; fill: #3f3f56; }
    </style>
  </defs>

  <rect width="1000" height="400" fill="url(#bgGrad)"/>

  <!-- floating glow blobs -->
  <circle cx="130" cy="70" r="130" fill="url(#glowPurple)" filter="url(#blob)">
    <animate attributeName="cx" values="130;170;130" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="360" r="160" fill="url(#glowCyan)" filter="url(#blob)">
    <animate attributeName="cy" values="360;320;360" dur="10s" repeatCount="indefinite"/>
  </circle>

  <rect width="1000" height="400" fill="url(#dots)"/>

  <!-- editor card -->
  <rect x="60" y="55" width="880" height="292" rx="16" fill="#111119" stroke="#2a2a3d" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M60,71 a16,16 0 0 1 16,-16 h848 a16,16 0 0 1 16,16 v28 h-880 z" fill="#181826"/>
  <circle cx="90" cy="79" r="6.5" fill="#ff5f56"/>
  <circle cx="112" cy="79" r="6.5" fill="#ffbd2e"/>
  <circle cx="134" cy="79" r="6.5" fill="#27c93f"/>

  <!-- tabs -->
  <rect x="440" y="55" width="120" height="44" fill="#111119"/>
  <text x="500" y="82" text-anchor="middle" class="code" font-size="13" fill="#c9c9e0">shashank.js</text>
  <rect x="497" y="88" width="6" height="6" rx="1" fill="#818cf8" opacity="0.0"/>
  <rect x="440" y="97" width="120" height="2" fill="url(#accentGrad)"/>

  <!-- line numbers -->
  <text x="88"  y="140" class="ln" text-anchor="end">1</text>
  <text x="88"  y="170" class="ln" text-anchor="end">2</text>
  <text x="88"  y="200" class="ln" text-anchor="end">3</text>
  <text x="88"  y="230" class="ln" text-anchor="end">4</text>
  <text x="88"  y="260" class="ln" text-anchor="end">5</text>
  <text x="88"  y="290" class="ln" text-anchor="end">6</text>
  <text x="88"  y="320" class="ln" text-anchor="end">7</text>

  <!-- code content -->
  <text x="112" y="140" class="code"><tspan class="kw">const</tspan><tspan class="pun"> shashank = {</tspan></text>
  <text x="112" y="170" class="code"><tspan class="prop">  role</tspan><tspan class="pun">: </tspan><tspan class="str">"Management Student"</tspan><tspan class="pun">,</tspan></text>
  <text x="112" y="200" class="code"><tspan class="prop">  reality</tspan><tspan class="pun">: </tspan><tspan class="str">"...who actually ships code"</tspan><tspan class="pun">,</tspan></text>
  <text x="112" y="230" class="code"><tspan class="prop">  stack</tspan><tspan class="pun">: [</tspan><tspan class="str">"Python"</tspan><tspan class="pun">, </tspan><tspan class="str">"SQL"</tspan><tspan class="pun">, </tspan><tspan class="str">"Automation"</tspan><tspan class="pun">],</tspan></text>
  <text x="112" y="260" class="code"><tspan class="prop">  based_in</tspan><tspan class="pun">: </tspan><tspan class="str">"India"</tspan><tspan class="pun">,</tspan></text>
  <text x="112" y="290" class="code"><tspan class="prop">  motto</tspan><tspan class="pun">: </tspan><tspan class="str">"build → break → fix → repeat"</tspan><tspan class="pun">,</tspan></text>
  <text x="112" y="320" class="code"><tspan class="pun">};</tspan><tspan class="cursor"> </tspan></text>

  <rect x="150" y="308" width="10" height="18" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent bar -->
  <rect x="60" y="341" width="880" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
