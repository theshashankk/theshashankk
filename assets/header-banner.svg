<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 16px; }
      .kw   { fill: #ff7b72; }
      .str  { fill: #a5d6ff; }
      .prop { fill: #79c0ff; }
      .pun  { fill: #8b949e; }
      .ln   { font-family: Consolas, monospace; font-size: 13px; fill: #484f58; }
      .tab  { font-family: -apple-system, 'Segoe UI', Ubuntu, sans-serif; font-size: 13px; fill: #c9d1d9; }
    </style>
  </defs>

  <rect width="1000" height="360" fill="#0d1117"/>

  <!-- card -->
  <rect x="40" y="30" width="920" height="300" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <path d="M40,40 a10,10 0 0 1 10,-10 h880 a10,10 0 0 1 10,10 v26 h-900 z" fill="#161b22"/>
  <line x1="40" y1="66" x2="960" y2="66" stroke="#30363d" stroke-width="1"/>
  <circle cx="66" cy="53" r="5.5" fill="#f85149"/>
  <circle cx="86" cy="53" r="5.5" fill="#d29922"/>
  <circle cx="106" cy="53" r="5.5" fill="#3fb950"/>
  <text x="500" y="57" text-anchor="middle" class="tab">shashank.js</text>

  <!-- line numbers -->
  <text x="80"  y="112" class="ln" text-anchor="end">1</text>
  <text x="80"  y="140" class="ln" text-anchor="end">2</text>
  <text x="80"  y="168" class="ln" text-anchor="end">3</text>
  <text x="80"  y="196" class="ln" text-anchor="end">4</text>
  <text x="80"  y="224" class="ln" text-anchor="end">5</text>
  <text x="80"  y="252" class="ln" text-anchor="end">6</text>
  <text x="80"  y="280" class="ln" text-anchor="end">7</text>
  <line x1="98" y1="90" x2="98" y2="300" stroke="#21262d" stroke-width="1"/>

  <!-- code -->
  <text x="118" y="112" class="code"><tspan class="kw">const</tspan><tspan class="pun"> shashank = {</tspan></text>
  <text x="118" y="140" class="code"><tspan class="prop">  role</tspan><tspan class="pun">: </tspan><tspan class="str">"Management Student"</tspan><tspan class="pun">,</tspan></text>
  <text x="118" y="168" class="code"><tspan class="prop">  reality</tspan><tspan class="pun">: </tspan><tspan class="str">"...who actually ships code"</tspan><tspan class="pun">,</tspan></text>
  <text x="118" y="196" class="code"><tspan class="prop">  stack</tspan><tspan class="pun">: [</tspan><tspan class="str">"Python"</tspan><tspan class="pun">, </tspan><tspan class="str">"SQL"</tspan><tspan class="pun">, </tspan><tspan class="str">"Automation"</tspan><tspan class="pun">],</tspan></text>
  <text x="118" y="224" class="code"><tspan class="prop">  based_in</tspan><tspan class="pun">: </tspan><tspan class="str">"India"</tspan><tspan class="pun">,</tspan></text>
  <text x="118" y="252" class="code"><tspan class="prop">  motto</tspan><tspan class="pun">: </tspan><tspan class="str">"build → break → fix → repeat"</tspan><tspan class="pun">,</tspan></text>
  <text x="118" y="280" class="code"><tspan class="pun">};</tspan></text>

  <rect x="145" y="269" width="9" height="16" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent -->
  <rect x="40" y="320" width="920" height="2" fill="#58a6ff"/>
</svg>
